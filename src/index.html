<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Visualizer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.3/lib/browser/math.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.33.0/plotly.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="chat-panel">
      <h1>Math Visualizer</h1>
      <div id="log"></div>
      <form id="prompt-form">
        <input id="prompt-input" type="text" placeholder="e.g. plot sin(x) * x from -10 to 10" autocomplete="off" />
        <button type="submit">Plot</button>
      </form>
      <button id="reset-btn" type="button">New conversation</button>
    </aside>
    <main id="plot-panel">
      <div id="plot"></div>
    </main>
  </div>

  <div id="key-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Anthropic API Key</h2>
      <p>Enter your Anthropic API key. It's stored locally in your user config folder, never sent anywhere except api.anthropic.com.</p>
      <input id="key-input" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <button id="key-submit" type="button">Save</button>
      <p id="key-error" class="error hidden"></p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
